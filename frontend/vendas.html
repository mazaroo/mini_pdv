<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Nova Venda - Mini PDV</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style_roxo.css">
  <script>document.documentElement.setAttribute('data-tema', localStorage.getItem('tema') || 'escuro');</script>
</head>
<body>
  <div class="container">
    <h1>💰 Nova Venda</h1>

    <form id="form-venda">
      <label for="cliente">Cliente</label>
      <div class="campo-com-acao">
        <select id="cliente"></select>
        <button type="button" id="btn-novo-cliente" class="secundario" title="Cadastrar cliente rápido">+ Novo</button>
      </div>

      <label>Vendedor</label>
      <p id="vendedor-logado" class="campo-fixo"></p>

      <label for="pagamento">Forma de pagamento</label>
      <select id="pagamento" required>
        <option value="Pix">Pix</option>
        <option value="Cartão">Cartão</option>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Fiado">Fiado</option>
      </select>

      <div id="bloco-fiado" style="display:none;">
        <label for="vencimento">Vencimento</label>
        <input type="date" id="vencimento">
      </div>

      <hr style="margin-top:20px;">
      <h3>Adicionar item</h3>

      <label for="busca-produto">Produto</label>
      <div class="busca-produto-wrap">
        <input type="text" id="busca-produto" placeholder="🔎 Digite o nome do produto..." autocomplete="off">
        <div id="resultados-produto" class="resultados-busca"></div>
      </div>

      <label for="quantidade">Quantidade</label>
      <input type="number" id="quantidade" min="1" value="1">

      <button type="button" id="btn-add-item" class="secundario">+ Adicionar item à venda</button>

      <div id="lista-itens" style="margin-top:16px;"></div>

      <hr style="margin-top:20px;">
      <label for="desconto-valor">Desconto (opcional)</label>
      <div class="campo-desconto">
        <select id="desconto-tipo">
          <option value="percentual">%</option>
          <option value="valor">R$</option>
        </select>
        <input type="number" id="desconto-valor" min="0" step="0.01" value="0">
      </div>

      <div id="total-venda"></div>

      <button type="submit">Finalizar venda</button>
    </form>
  </div>

  <div id="modal-novo-cliente" class="modal-overlay">
    <div class="modal-recibo modal-form-cliente">
      <h2>👤 Cadastrar cliente rápido</h2>
      <label for="novo-cliente-nome">Nome</label>
      <input type="text" id="novo-cliente-nome" required>

      <label for="novo-cliente-cpf">CPF (opcional)</label>
      <input type="text" id="novo-cliente-cpf" placeholder="000.000.000-00">

      <label for="novo-cliente-telefone">Telefone (opcional)</label>
      <input type="text" id="novo-cliente-telefone" placeholder="(00) 00000-0000">

      <label for="novo-cliente-email">Email (opcional)</label>
      <input type="email" id="novo-cliente-email">

      <div class="modal-acoes">
        <button type="button" id="btn-salvar-novo-cliente">Cadastrar e usar na venda</button>
        <button type="button" id="btn-cancelar-novo-cliente" class="secundario">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="modal-recibo" class="modal-overlay">
    <div class="modal-recibo">
      <div id="recibo-conteudo" class="recibo"></div>
      <div class="modal-acoes">
        <button type="button" id="btn-imprimir-recibo">🖨️ Imprimir</button>
        <button type="button" id="btn-fechar-recibo" class="secundario">Fechar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    exigirLogin();
    exigirPermissao('pode_vendas');
    renderizarNavbar('vendas');

    const usuarioLogado = getUsuarioLogado();
    document.getElementById('vendedor-logado').textContent = `👋 ${usuarioLogado.nome}`;

    let produtosDisponiveis = [];
    let produtoSelecionado = null;
    let itensVenda = []; // { produto_id, nome, quantidade, preco_unitario }
    let clientesDisponiveis = [];

    async function carregarClientes() {
      clientesDisponiveis = await apiGet('/api/clientes');
      renderizarSelectClientes();
    }

    function renderizarSelectClientes(selecionarId) {
      const select = document.getElementById('cliente');
      const anterior = selecionarId ?? select.value;
      select.innerHTML =
        '<option value="">— Consumidor Final —</option>' +
        clientesDisponiveis.map(c => `<option value="${c.cliente_id}">${c.nome}</option>`).join('');
      if (anterior) select.value = anterior;
    }

    // ---------- cadastro rápido de cliente (sem sair da tela de venda) ----------

    document.getElementById('btn-novo-cliente').addEventListener('click', () => {
      document.getElementById('modal-novo-cliente').classList.add('ativo');
      document.getElementById('novo-cliente-nome').focus();
    });

    document.getElementById('btn-cancelar-novo-cliente').addEventListener('click', fecharModalNovoCliente);

    function fecharModalNovoCliente() {
      document.getElementById('modal-novo-cliente').classList.remove('ativo');
      document.getElementById('novo-cliente-nome').value = '';
      document.getElementById('novo-cliente-cpf').value = '';
      document.getElementById('novo-cliente-telefone').value = '';
      document.getElementById('novo-cliente-email').value = '';
    }

    document.getElementById('novo-cliente-cpf').addEventListener('input', (e) => { e.target.value = mascararCPF(e.target.value); });
    document.getElementById('novo-cliente-telefone').addEventListener('input', (e) => { e.target.value = mascararTelefone(e.target.value); });

    document.getElementById('btn-salvar-novo-cliente').addEventListener('click', async () => {
      const dados = {
        nome: document.getElementById('novo-cliente-nome').value,
        cpf: document.getElementById('novo-cliente-cpf').value,
        telefone: document.getElementById('novo-cliente-telefone').value,
        email: document.getElementById('novo-cliente-email').value,
      };

      if (!dados.nome.trim()) {
        mostrarToast('Digite o nome do cliente', 'erro');
        return;
      }
      if (dados.cpf && !validarCPF(dados.cpf)) {
        mostrarToast('CPF inválido', 'erro');
        return;
      }
      if (dados.telefone && !validarTelefone(dados.telefone)) {
        mostrarToast('Telefone inválido. Use o formato (00) 00000-0000.', 'erro');
        return;
      }
      if (dados.email && !validarEmail(dados.email)) {
        mostrarToast('Email inválido', 'erro');
        return;
      }

      const resultado = await apiPost('/api/clientes', dados);
      if (resultado.erro) {
        mostrarToast(resultado.erro, 'erro');
        return;
      }

      mostrarToast(`✔ Cliente "${dados.nome}" cadastrado`, 'sucesso');
      clientesDisponiveis.push({ cliente_id: resultado.id, nome: dados.nome });
      renderizarSelectClientes(resultado.id); // já deixa selecionado na venda em andamento
      fecharModalNovoCliente();
    });

    async function carregarProdutos() {
      produtosDisponiveis = await apiGet('/api/produtos');
    }

    // ---------- busca rápida de produto ----------

    function renderizarResultadosProduto(lista) {
      const container = document.getElementById('resultados-produto');
      if (lista.length === 0) {
        container.innerHTML = '';
        container.style.display = 'none';
        return;
      }
      container.innerHTML = lista.slice(0, 8).map(p => `
        <div class="resultado-item" onclick="selecionarProduto(${p.produto_id})">
          <span>${p.nome}</span>
          <span class="resultado-detalhe">${formatarMoeda(p.preco)} · estoque: ${p.estoque}</span>
        </div>
      `).join('');
      container.style.display = 'block';
    }

    function selecionarProduto(id) {
      produtoSelecionado = produtosDisponiveis.find(p => p.produto_id === id);
      document.getElementById('busca-produto').value = produtoSelecionado.nome;
      document.getElementById('resultados-produto').style.display = 'none';
    }

    document.getElementById('busca-produto').addEventListener('input', (e) => {
      produtoSelecionado = null;
      const termo = e.target.value.trim().toLowerCase();
      if (!termo) {
        renderizarResultadosProduto([]);
        return;
      }
      renderizarResultadosProduto(produtosDisponiveis.filter(p => p.nome.toLowerCase().includes(termo)));
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.busca-produto-wrap')) {
        document.getElementById('resultados-produto').style.display = 'none';
      }
    });

    // ---------- carrinho e desconto ----------

    function calcularDescontoReais(subtotal) {
      const tipo = document.getElementById('desconto-tipo').value;
      const valor = parseFloat(document.getElementById('desconto-valor').value) || 0;
      if (valor <= 0 || subtotal <= 0) return 0;
      let desconto = tipo === 'percentual' ? subtotal * (valor / 100) : valor;
      if (desconto > subtotal) desconto = subtotal;
      if (desconto < 0) desconto = 0;
      return desconto;
    }

    function renderizarItens() {
      const container = document.getElementById('lista-itens');
      container.innerHTML = '';
      let subtotal = 0;

      itensVenda.forEach((item, index) => {
        const itemSubtotal = item.quantidade * item.preco_unitario;
        subtotal += itemSubtotal;
        container.innerHTML += `
          <div class="item-venda">
            <span>${item.quantidade}x ${item.nome} — ${formatarMoeda(itemSubtotal)}</span>
            <button type="button" onclick="removerItem(${index})">Remover</button>
          </div>
        `;
      });

      const totalDiv = document.getElementById('total-venda');
      if (itensVenda.length === 0) {
        totalDiv.innerHTML = '';
        return;
      }

      const desconto = calcularDescontoReais(subtotal);
      const total = subtotal - desconto;

      totalDiv.innerHTML = `
        <div class="total-linha"><span>Subtotal</span><span>${formatarMoeda(subtotal)}</span></div>
        ${desconto > 0 ? `<div class="total-linha total-desconto"><span>Desconto</span><span>− ${formatarMoeda(desconto)}</span></div>` : ''}
        <div class="total-linha total-final"><span>Total</span><span>${formatarMoeda(total)}</span></div>
      `;
    }

    document.getElementById('desconto-tipo').addEventListener('change', renderizarItens);
    document.getElementById('desconto-valor').addEventListener('input', renderizarItens);

    document.getElementById('pagamento').addEventListener('change', (e) => {
      const ehFiado = e.target.value === 'Fiado';
      document.getElementById('bloco-fiado').style.display = ehFiado ? 'block' : 'none';
    });

    function removerItem(index) {
      itensVenda.splice(index, 1);
      renderizarItens();
    }

    document.getElementById('btn-add-item').addEventListener('click', () => {
      const quantidade = parseInt(document.getElementById('quantidade').value);

      if (!produtoSelecionado) {
        mostrarToast('Busque e selecione um produto', 'erro');
        return;
      }
      if (!quantidade || quantidade < 1) {
        mostrarToast('Informe uma quantidade válida', 'erro');
        return;
      }

      itensVenda.push({
        produto_id: produtoSelecionado.produto_id,
        nome: produtoSelecionado.nome,
        quantidade: quantidade,
        preco_unitario: produtoSelecionado.preco,
      });

      renderizarItens();

      produtoSelecionado = null;
      document.getElementById('busca-produto').value = '';
      document.getElementById('quantidade').value = 1;
    });

    document.getElementById('form-venda').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (itensVenda.length === 0) {
        mostrarToast('Adicione ao menos um item à venda', 'erro');
        return;
      }

      const clienteId = document.getElementById('cliente').value || null;
      const formaPagamento = document.getElementById('pagamento').value;
      const vencimento = document.getElementById('vencimento').value;

      if (formaPagamento === 'Fiado' && !clienteId) {
        mostrarToast('Venda fiado precisa de um cliente cadastrado — escolha um ou cadastre com o botão "+ Novo"', 'erro');
        return;
      }
      if (formaPagamento === 'Fiado' && !vencimento) {
        mostrarToast('Escolha a data de vencimento do fiado', 'erro');
        return;
      }

      const subtotal = itensVenda.reduce((soma, i) => soma + i.quantidade * i.preco_unitario, 0);
      const desconto = calcularDescontoReais(subtotal);

      const dados = {
        cliente_id: clienteId,
        funcionario_id: usuarioLogado.funcionario_id,
        forma_pagamento: formaPagamento,
        desconto: desconto,
        data_vencimento: formaPagamento === 'Fiado' ? vencimento : null,
        itens: itensVenda.map(i => ({
          produto_id: i.produto_id,
          quantidade: i.quantidade,
          preco_unitario: i.preco_unitario,
        })),
      };

      const resultado = await apiPost('/api/vendas', dados);

      if (resultado.erro) {
        mostrarToast(resultado.erro, 'erro');
      } else {
        mostrarToast(`✔ ${resultado.mensagem} (venda #${resultado.venda_id})`, 'sucesso');

        const nomeCliente = document.getElementById('cliente').selectedOptions[0]?.textContent ?? 'Consumidor Final';
        abrirRecibo(resultado.venda_id, nomeCliente, usuarioLogado.nome, formaPagamento, itensVenda, desconto, vencimento);

        itensVenda = [];
        document.getElementById('desconto-valor').value = 0;
        document.getElementById('pagamento').value = 'Pix';
        document.getElementById('bloco-fiado').style.display = 'none';
        document.getElementById('vencimento').value = '';
        renderizarSelectClientes('');
        renderizarItens();
        carregarProdutos(); // atualiza estoque na lista
      }
    });

    function abrirRecibo(vendaId, nomeCliente, nomeFuncionario, formaPagamento, itens, desconto, vencimento) {
      let subtotal = 0;
      const linhas = itens.map(i => {
        const itemSubtotal = i.quantidade * i.preco_unitario;
        subtotal += itemSubtotal;
        return `
          <div class="recibo-item">
            <span>${i.quantidade}x ${i.nome}</span>
            <span>${formatarMoeda(itemSubtotal)}</span>
          </div>
        `;
      }).join('');

      const total = subtotal - desconto;

      document.getElementById('recibo-conteudo').innerHTML = `
        <h2>🛒 Mini PDV</h2>
        <p class="recibo-sub">Comprovante de venda #${vendaId}</p>
        <div class="recibo-linha"><span>Data</span><span>${formatarData(new Date().toISOString())}</span></div>
        <div class="recibo-linha"><span>Cliente</span><span>${nomeCliente}</span></div>
        <div class="recibo-linha"><span>Funcionário</span><span>${nomeFuncionario}</span></div>
        <div class="recibo-linha"><span>Pagamento</span><span>${formaPagamento}</span></div>
        ${formaPagamento === 'Fiado' && vencimento ? `<div class="recibo-linha"><span>Vencimento</span><span>${formatarDataSimples(vencimento)}</span></div>` : ''}
        <hr>
        ${linhas}
        <hr>
        <div class="recibo-linha"><span>Subtotal</span><span>${formatarMoeda(subtotal)}</span></div>
        ${desconto > 0 ? `<div class="recibo-linha"><span>Desconto</span><span>− ${formatarMoeda(desconto)}</span></div>` : ''}
        <div class="recibo-total"><span>Total</span><span>${formatarMoeda(total)}</span></div>
        <p class="recibo-rodape">Obrigado pela preferência! 💜</p>
      `;

      document.getElementById('modal-recibo').classList.add('ativo');
    }

    document.getElementById('btn-fechar-recibo').addEventListener('click', () => {
      document.getElementById('modal-recibo').classList.remove('ativo');
    });

    document.getElementById('btn-imprimir-recibo').addEventListener('click', () => {
      window.print();
    });

    carregarClientes();
    carregarProdutos();
  </script>
</body>
</html>
