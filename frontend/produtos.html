<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Produtos - Mini PDV</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style_roxo.css">
  <script>document.documentElement.setAttribute('data-tema', localStorage.getItem('tema') || 'escuro');</script>
</head>
<body>
  <div class="container">
    <h1>📦 Produtos</h1>

    <form id="form-produto">
      <label for="nome">Nome</label>
      <input type="text" id="nome" required>

      <label for="categoria">Categoria</label>
      <div class="campo-com-acao">
        <select id="categoria" required></select>
        <button type="button" id="btn-nova-categoria" class="secundario" title="Criar categoria nova">+ Nova</button>
      </div>

      <div id="bloco-nova-categoria" class="bloco-inline" style="display:none;">
        <input type="text" id="nome-nova-categoria" placeholder="Nome da nova categoria">
        <button type="button" id="btn-confirmar-categoria">Adicionar</button>
        <button type="button" id="btn-cancelar-categoria" class="secundario">Cancelar</button>
      </div>

      <label for="preco">Preço</label>
      <input type="number" step="0.01" id="preco" required>

      <label for="estoque">Estoque</label>
      <input type="number" id="estoque" value="0">

      <label for="imagem">Foto do produto (opcional)</label>
      <div class="campo-imagem">
        <img id="preview-imagem" class="preview-imagem" style="display:none;">
        <input type="file" id="imagem" accept="image/*">
      </div>

      <button type="submit" id="btn-salvar-produto">Cadastrar produto</button>
      <button type="button" id="btn-cancelar-produto" class="secundario" style="display:none;">Cancelar edição</button>
    </form>

    <div class="lista-header">
      <h2>Produtos cadastrados</h2>
      <input type="text" id="busca-produto" class="busca" placeholder="🔎 Buscar por nome...">
    </div>
    <table>
      <thead>
        <tr>
          <th></th>
          <th>ID</th>
          <th>Nome</th>
          <th>Categoria</th>
          <th>Preço</th>
          <th>Estoque</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabela-produtos"></tbody>
    </table>

    <details class="painel-categorias">
      <summary>🏷️ Gerenciar categorias</summary>
      <div class="painel-categorias-conteudo">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Descrição</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabela-categorias"></tbody>
        </table>
      </div>
    </details>
  </div>

  <script src="app.js"></script>
  <script>
    exigirLogin();
    exigirPermissao('pode_produtos');
    renderizarNavbar('produtos');

    const form = document.getElementById('form-produto');
    const btnSalvar = document.getElementById('btn-salvar-produto');
    const btnCancelar = document.getElementById('btn-cancelar-produto');
    let produtos = [];
    let categorias = [];
    let editandoId = null;
    let editandoCategoriaId = null;
    const ESTOQUE_BAIXO = 10;

    async function carregarCategorias() {
      categorias = await apiGet('/api/categorias');
      const select = document.getElementById('categoria');
      const selecaoAnterior = select.value;
      select.innerHTML = categorias.map(c => `<option value="${c.categoria_id}">${c.nome}</option>`).join('');
      if (selecaoAnterior) select.value = selecaoAnterior;
      renderizarCategorias();
    }

    function renderizarCategorias() {
      const tbody = document.getElementById('tabela-categorias');
      tbody.innerHTML = categorias.map(c => `
        <tr>
          <td>${c.nome}</td>
          <td>${c.descricao ?? ''}</td>
          <td class="acoes">
            <button type="button" class="icone" onclick="editarCategoria(${c.categoria_id})" title="Editar">✏️</button>
            <button type="button" class="icone perigo" onclick="excluirCategoria(${c.categoria_id})" title="Excluir">🗑️</button>
          </td>
        </tr>
      `).join('');
      animarLinhas(tbody);
    }

    async function criarCategoria(nome) {
      const resultado = await apiPost('/api/categorias', { nome });
      if (resultado.erro) {
        mostrarToast(resultado.erro, 'erro');
        return null;
      }
      mostrarToast(`✔ Categoria "${nome}" criada`, 'sucesso');
      await carregarCategorias();
      return resultado.id;
    }

    document.getElementById('btn-nova-categoria').addEventListener('click', () => {
      document.getElementById('bloco-nova-categoria').style.display = 'flex';
      document.getElementById('nome-nova-categoria').focus();
    });

    document.getElementById('btn-cancelar-categoria').addEventListener('click', () => {
      document.getElementById('bloco-nova-categoria').style.display = 'none';
      document.getElementById('nome-nova-categoria').value = '';
    });

    document.getElementById('btn-confirmar-categoria').addEventListener('click', async () => {
      const campo = document.getElementById('nome-nova-categoria');
      const nome = campo.value.trim();
      if (!nome) {
        mostrarToast('Digite o nome da categoria', 'erro');
        return;
      }

      const id = await criarCategoria(nome);
      if (id) {
        document.getElementById('categoria').value = id;
        campo.value = '';
        document.getElementById('bloco-nova-categoria').style.display = 'none';
      }
    });

    function editarCategoria(id) {
      const c = categorias.find(x => x.categoria_id === id);
      if (!c) return;

      const novoNome = prompt('Nome da categoria:', c.nome);
      if (novoNome === null || !novoNome.trim()) return;

      const novaDescricao = prompt('Descrição (opcional):', c.descricao ?? '');
      if (novaDescricao === null) return;

      apiPut(`/api/categorias/${id}`, { nome: novoNome.trim(), descricao: novaDescricao.trim() || null })
        .then(resultado => {
          if (resultado.erro) {
            mostrarToast(resultado.erro, 'erro');
          } else {
            mostrarToast('✔ Categoria atualizada', 'sucesso');
            carregarCategorias();
            carregarProdutos();
          }
        });
    }

    async function excluirCategoria(id) {
      if (!confirm('Tem certeza que deseja excluir essa categoria?')) return;

      const resultado = await apiDelete(`/api/categorias/${id}`);
      if (resultado.erro) {
        mostrarToast(resultado.erro, 'erro');
      } else {
        mostrarToast(`✔ ${resultado.mensagem}`, 'sucesso');
        carregarCategorias();
      }
    }

    async function carregarProdutos() {
      produtos = await apiGet('/api/produtos');
      renderizarProdutos(produtos);
    }

    function renderizarProdutos(lista) {
      const tbody = document.getElementById('tabela-produtos');
      tbody.innerHTML = '';
      lista.forEach(p => {
        const estoqueBaixo = p.estoque < ESTOQUE_BAIXO;
        tbody.innerHTML += `
          <tr class="${estoqueBaixo ? 'linha-alerta' : ''}">
            <td>${p.imagem ? `<img src="/${p.imagem}" class="miniatura-produto">` : '<span class="miniatura-vazia">📦</span>'}</td>
            <td>${p.produto_id}</td>
            <td>${p.nome}</td>
            <td>${p.categoria}</td>
            <td>${formatarMoeda(p.preco)}</td>
            <td>${p.estoque} ${estoqueBaixo ? '<span class="badge-baixo">baixo</span>' : ''}</td>
            <td class="acoes">
              <button type="button" class="icone" onclick="editarProduto(${p.produto_id})" title="Editar">✏️</button>
              <button type="button" class="icone perigo" onclick="excluirProduto(${p.produto_id})" title="Excluir">🗑️</button>
            </td>
          </tr>
        `;
      });
      animarLinhas(tbody);
    }

    function editarProduto(id) {
      const p = produtos.find(x => x.produto_id === id);
      if (!p) return;

      editandoId = id;
      document.getElementById('nome').value = p.nome ?? '';
      document.getElementById('preco').value = p.preco ?? '';
      document.getElementById('estoque').value = p.estoque ?? 0;

      const selectCategoria = document.getElementById('categoria');
      [...selectCategoria.options].forEach(opt => {
        if (opt.textContent === p.categoria) selectCategoria.value = opt.value;
      });

      const preview = document.getElementById('preview-imagem');
      if (p.imagem) {
        preview.src = `/${p.imagem}`;
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }

      btnSalvar.textContent = 'Salvar alterações';
      btnCancelar.style.display = 'inline-block';
      form.scrollIntoView({ behavior: 'smooth' });
    }

    function sairModoEdicao() {
      editandoId = null;
      form.reset();
      document.getElementById('preview-imagem').style.display = 'none';
      btnSalvar.textContent = 'Cadastrar produto';
      btnCancelar.style.display = 'none';
    }

    document.getElementById('imagem').addEventListener('change', (e) => {
      const arquivo = e.target.files[0];
      const preview = document.getElementById('preview-imagem');
      if (!arquivo) return;

      const leitor = new FileReader();
      leitor.onload = () => {
        preview.src = leitor.result;
        preview.style.display = 'block';
      };
      leitor.readAsDataURL(arquivo);
    });

    async function excluirProduto(id) {
      if (!confirm('Tem certeza que deseja excluir este produto?')) return;

      const resultado = await apiDelete(`/api/produtos/${id}`);
      if (resultado.erro) {
        mostrarToast(resultado.erro, 'erro');
      } else {
        mostrarToast(`✔ ${resultado.mensagem}`, 'sucesso');
        if (editandoId === id) sairModoEdicao();
        carregarProdutos();
      }
    }

    btnCancelar.addEventListener('click', sairModoEdicao);

    document.getElementById('busca-produto').addEventListener('input', (e) => {
      const termo = e.target.value.trim().toLowerCase();
      renderizarProdutos(produtos.filter(p => p.nome.toLowerCase().includes(termo)));
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const dados = {
        nome: document.getElementById('nome').value,
        categoria_id: document.getElementById('categoria').value,
        preco: document.getElementById('preco').value,
        estoque: document.getElementById('estoque').value,
      };

      const resultado = editandoId
        ? await apiPut(`/api/produtos/${editandoId}`, dados)
        : await apiPost('/api/produtos', dados);

      if (resultado.erro) {
        mostrarToast(resultado.erro, 'erro');
        return;
      }

      // Se uma foto foi escolhida, envia ela num segundo passo (o produto já existe)
      const arquivoImagem = document.getElementById('imagem').files[0];
      const produtoId = editandoId || resultado.id;

      if (arquivoImagem) {
        const formData = new FormData();
        formData.append('imagem', arquivoImagem);
        const resultadoImagem = await apiUpload(`/api/produtos/${produtoId}/imagem`, formData);
        if (resultadoImagem.erro) {
          mostrarToast(`Produto salvo, mas a foto falhou: ${resultadoImagem.erro}`, 'erro');
          sairModoEdicao();
          carregarProdutos();
          return;
        }
      }

      mostrarToast(`✔ ${resultado.mensagem}`, 'sucesso');
      sairModoEdicao();
      carregarProdutos();
    });

    carregarCategorias();
    carregarProdutos();
  </script>
</body>
</html>
